// ============================================================
// FX PANEL
// ============================================================
function renderFxPanel(){
  const track=state.tracks.find(t=>t.id===state.selectedTrackId);
  if(!track){fxTrackInfo.innerHTML='<div class="none">Select a track to edit effects</div>';fxSections.innerHTML='';return}
  fxTrackInfo.innerHTML=`<div class="dot" style="background:${track.color};box-shadow:0 0 6px ${track.color}88;"></div><div class="name">${escapeHtml(track.name)}</div>`;
  const defs=[
    {key:'reverb',label:'Reverb',icon:'M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M12 3v18M3 12h18'},
    {key:'delay',label:'Delay',icon:'M12 2v20M2 12h20M4 4l16 16M20 4L4 20'},
    {key:'distortion',label:'Drive',icon:'M13 2L3 14h9l-1 8 10-12h-9l1-8z'},
    {key:'filter',label:'Lowpass',icon:'M3 12h3l2-6 4 12 4-9 2 3h3'},
  ];
  fxSections.innerHTML='';
  defs.forEach(def=>{
    const fxData=track.fx[def.key];
    const section=document.createElement('div');section.className='fx-section'+(fxData.enabled?' on':'')+' open';section.dataset.fx=def.key;
    let sliders='';
    if(def.key==='reverb')sliders=sliderRow('Wet','wet',0,1,fxData.wet,100);
    else if(def.key==='delay')sliders=sliderRow('Time','time',0.02,1.5,fxData.time,100,'s')+sliderRow('Feedback','feedback',0,0.85,fxData.feedback,100)+sliderRow('Mix','mix',0,1,fxData.mix,100);
    else if(def.key==='distortion')sliders=sliderRow('Amount','amount',0,1,fxData.amount,100);
    else if(def.key==='filter')sliders=sliderRow('Cutoff','cutoff',200,20000,fxData.cutoff,1,'Hz')+sliderRow('Resonance','resonance',0.1,15,fxData.resonance,10);
    section.innerHTML=`
      <div class="fx-header"><div class="fx-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${def.icon}"/></svg>${def.label}</div><div class="fx-led"></div></div>
      <div class="fx-body">${sliders}</div>`;
    section.querySelector('.fx-header').addEventListener('click',()=>{fxData.enabled=!fxData.enabled;section.classList.toggle('on',fxData.enabled);applyTrackFx(track);pushHistory()});
    section.querySelectorAll('.fx-slider').forEach(slider=>{
      const param=slider.dataset.param;const display=slider.parentElement.querySelector('.val');
      slider.addEventListener('input',e=>{const v=parseFloat(e.target.value);track.fx[def.key][param]=v;if(display)display.textContent=formatFxValue(def.key,param,v);applyTrackFx(track)});
      slider.addEventListener('pointerdown',e=>e.stopPropagation());
    });
    fxSections.appendChild(section);
  });
}
function sliderRow(label,param,min,max,value,scale,unit){const step=(max-min)/200;return`<div class="fx-slider-row"><div class="fx-slider-label"><span>${label}</span><span class="val" data-param="${param}">${formatFxValue(null,param,value,unit)}</span></div><input type="range" class="fx-slider" data-param="${param}" min="${min}" max="${max}" step="${step}" value="${value}"></div>`}
function formatFxValue(fxKey,param,v,unit){if(param==='cutoff')return Math.round(v)+' Hz';if(param==='time')return v.toFixed(2)+' s';if(param==='resonance')return v.toFixed(1);if(unit==='Hz')return Math.round(v)+' Hz';if(unit==='s')return v.toFixed(2)+' s';return Math.round(v*100)+'%'}

// ============================================================
// EVENT LISTENERS
// ============================================================
uploadBtn.addEventListener('click',()=>{ensureAudio();resumeAudio();fileInput.click()});
fileInput.addEventListener('change',e=>{if(e.target.files&&e.target.files.length)handleFiles(e.target.files);e.target.value=''});

// Sound category filter
soundCats.addEventListener('click',e=>{const btn=e.target.closest('.sound-cat');if(!btn)return;document.querySelectorAll('.sound-cat').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.soundCat=btn.dataset.cat;renderSampleList()});

// Tools
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');state.tool=btn.dataset.tool;
    timelineContent.className='timeline-content tool-'+state.tool;
  });
});

// Zoom
zoomInBtn.addEventListener('click',()=>{state.pixelsPerSecond=Math.min(600,state.pixelsPerSecond+25);renderTimeline()});
zoomOutBtn.addEventListener('click',()=>{state.pixelsPerSecond=Math.max(15,state.pixelsPerSecond-25);renderTimeline()});
fitBtn.addEventListener('click',()=>{const scrollW=timelineScroll.clientWidth-170;const dur=getTimelineDuration();if(dur>0)state.pixelsPerSecond=clamp(scrollW/dur,15,600);renderTimeline();timelineScroll.scrollLeft=0});

// Grid
gridSelect.addEventListener('change',e=>{const v=e.target.value;if(v==='0'){state.gridOn=false}else{state.gridOn=true;state.gridDiv=parseInt(v.split('/')[1],10)}});

// BPM
bpmInput.addEventListener('change',e=>{const v=clamp(parseInt(e.target.value,10)||120,40,300);state.bpm=v;bpmInput.value=v;renderTimeline()});

// Master volume
masterVol.addEventListener('input',e=>{state.masterVolume=parseInt(e.target.value,10)/100;if(state.masterGain)state.masterGain.gain.value=state.masterVolume});

// Transport
playBtn.addEventListener('click',()=>{if(state.isPlaying)stopPlayback();else{state.playhead=0;startPlayback()}});
rewindBtn.addEventListener('click',()=>{stopPlayback();state.playhead=0;updateTimeDisplay();updatePlayheadVisual()});
loopBtn.addEventListener('click',()=>{state.loop=!state.loop;loopBtn.classList.toggle('active',state.loop);showToast(state.loop?'Loop on':'Loop off')});
addTrackBtn.addEventListener('click',()=>addTrack());
undoBtn.addEventListener('click',undo);
redoBtn.addEventListener('click',redo);
duplicateBtn.addEventListener('click',duplicateSelectedClip);
copyBtn.addEventListener('click',copySelectedClip);
pasteBtn.addEventListener('click',pasteClip);

// Export/Import
exportBtn.addEventListener('click',()=>{
  const project={version:4,app:'minimal-studio',bpm:state.bpm,masterVolume:state.masterVolume,loop:state.loop,gridOn:state.gridOn,gridDiv:state.gridDiv,samples:state.samples.map(s=>({id:s.id,name:s.name})),tracks:state.tracks.map(t=>({id:t.id,name:t.name,color:t.color,volume:t.volume,mute:t.mute,solo:t.solo,fx:t.fx,clips:t.clips.map(c=>({id:c.id,note:c.note,sampleId:c.sampleId,start:c.start,duration:c.duration,cropStart:c.cropStart||0}))})),nextIds:state.nextIds};
  const blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`minimal-studio-${Date.now()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('Project exported');
});
importBtn.addEventListener('click',()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=e=>{const f=e.target.files[0];if(f)importProject(f)};inp.click()});
function importProject(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);if(!p||!p.tracks)throw new Error('Invalid project');
      state.tracks=p.tracks.map(t=>({id:t.id,name:t.name,color:t.color||TRACK_COLORS[0],volume:typeof t.volume==='number'?t.volume:1,mute:!!t.mute,solo:!!t.solo,fx:t.fx||defaultFx(),clips:(t.clips||[]).map(c=>({id:c.id,note:c.note,sampleId:c.sampleId,start:c.start,duration:c.duration,cropStart:c.cropStart||0})),audio:null}));
      state.samples=(p.samples||[]).map(s=>({id:s.id,name:s.name,buffer:null,cat:'user'}));
      state.nextIds=p.nextIds||{sample:1,track:1,clip:1};
      if(p.bpm){state.bpm=p.bpm;bpmInput.value=p.bpm}
      if(typeof p.masterVolume==='number'){state.masterVolume=p.masterVolume;masterVol.value=Math.round(p.masterVolume*100);if(state.masterGain)state.masterGain.gain.value=state.masterVolume}
      if(typeof p.loop==='boolean'){state.loop=p.loop;loopBtn.classList.toggle('active',state.loop)}
      if(typeof p.gridOn==='boolean'){state.gridOn=p.gridOn;if(p.gridDiv){state.gridDiv=p.gridDiv;gridSelect.value='1/'+p.gridDiv}}
      if(state.samples.length>0)state.selectedSampleId=state.samples[0].id;
      state.tracks.forEach(t=>buildTrackChain(t));
      renderSampleList();renderTimeline();renderFxPanel();state.playhead=0;updateTimeDisplay();pushHistory();
      showToast('Project imported — re-upload samples to hear them');
    }catch(err){showToast('Import failed: '+err.message,true)}
  };
  reader.readAsText(file);
}

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();if(state.isPlaying)stopPlayback();else{state.playhead=0;startPlayback()}}
  if(e.code==='Escape'){stopPlayback()}
  if((e.key==='Backspace'||e.key==='Delete')&&state.selectedClipId){e.preventDefault();state.tracks.forEach(t=>{t.clips=t.clips.filter(c=>c.id!==state.selectedClipId)});state.selectedClipId=null;renderTimeline();pushHistory()}
  if(e.key==='v'||e.key==='V')document.querySelector('.tool-btn[data-tool="select"]').click();
  if(e.key==='c'||e.key==='C')document.querySelector('.tool-btn[data-tool="crop"]').click();
  if(e.key==='s'||e.key==='S')document.querySelector('.tool-btn[data-tool="split"]').click();
  if(e.key==='e'||e.key==='E')document.querySelector('.tool-btn[data-tool="erase"]').click();
  if(e.key==='d'||e.key==='D')document.querySelector('.tool-btn[data-tool="duplicate"]').click();
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();if(e.shiftKey)redo();else undo()}
  if((e.metaKey||e.ctrlKey)&&e.key==='c'){e.preventDefault();copySelectedClip()}
  if((e.metaKey||e.ctrlKey)&&e.key==='v'){e.preventDefault();pasteClip()}
  if((e.metaKey||e.ctrlKey)&&e.key==='d'){e.preventDefault();duplicateSelectedClip()}
});

// iOS scroll prevention
document.addEventListener('touchmove',e=>{if(e.target.closest('.timeline-scroll')||e.target.closest('.sidebar-pane')||e.target.closest('.sample-list'))return;e.preventDefault()},{passive:false});

// ============================================================
// INIT
// ============================================================
function init(){
  const unlock=()=>{ensureAudio();resumeAudio();document.removeEventListener('pointerdown',unlock);document.removeEventListener('touchstart',unlock)};
  document.addEventListener('pointerdown',unlock,{once:true});
  document.addEventListener('touchstart',unlock,{once:true});

  buildPianoUI();updatePianoSelection();renderSampleList();renderTimeline();updateTimeDisplay();
  loopBtn.classList.toggle('active',state.loop);
  masterVol.value=Math.round(state.masterVolume*100);
  bpmInput.value=state.bpm;gridSelect.value='1/16';

  addTrack('Track 1');pushHistory();

  // Load built-in sounds after init
  setTimeout(()=>loadBuiltInSounds(),500);
}
init();
})();
  </script>
</body>
